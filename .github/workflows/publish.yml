name: Render and deploy paper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.2 matplotlib==3.8.4 \
                      jupyter nbformat ipykernel

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.57"

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages needed by the template
        run: |
          tlmgr update --self
          tlmgr install libertinus libertinus-fonts libertine \
                        fontspec unicode-math lmodern \
                        orcidlink lineno draftwatermark adjustbox \
                        pgf xcolor tabularx \
                        booktabs caption csquotes biblatex biber

      - name: Render manuscript (HTML)
        working-directory: paper
        run: |
          quarto render main.qmd --to computo-html
          cp _output/main.html _output/index.html

      - name: Render manuscript (PDF)
        working-directory: paper
        run: quarto render main.qmd --to computo-pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: paper/_output

  deploy:
    needs: render
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
